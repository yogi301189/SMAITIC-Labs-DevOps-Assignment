apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: node-api

spec:
  ingressClassName: nginx

  rules:
  - host: api.example.com

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: node-api

            port:
              number: 80
